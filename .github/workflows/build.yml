name: Build Android App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Pinned: newer stable Flutter requires Gradle >= 8.14, while this
          # project's generated Gradle wrapper is 8.12 (valid for 3.35.x).
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      # Keystore পাবলিক রিপোতে রাখা হয় না — GitHub Secrets থেকে আসে
      # (Settings → Secrets and variables → Actions)।
      - name: Prepare signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/workergigbd.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=workergigbd.jks
          EOF

      - run: flutter pub get

      - run: flutter analyze

      # Signed release builds: Gradle loads android/key.properties (written
      # above from secrets). The APK is a universal standalone build (all
      # ABIs, no splits) — uploadable to any store. The AAB is for Google Play.
      - run: flutter build apk --release

      - run: flutter build appbundle --release

      # সহজ নামে রিনেম করি — ডাউনলোডের পর চিনতে/শেয়ার করতে সুবিধা হয়।
      - name: Prepare release files
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p release-out
          cp build/app/outputs/flutter-apk/app-release.apk "release-out/Worker-Gig-BD.apk"
          cp build/app/outputs/bundle/release/app-release.aab "release-out/Worker-Gig-BD.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: Worker-Gig-BD-apk
          path: release-out/Worker-Gig-BD.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Worker-Gig-BD-aab
          path: release-out/Worker-Gig-BD.aab

      # সরাসরি APK ডাউনলোড লিংক (ZIP নয়):
      # https://github.com/wasimmostakim2965-ui/Worker-gig-BD-app/releases
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Worker Gig BD — Latest Build
          body: |
            ## 📱 ডাউনলোড (v${{ env.VERSION }})

            | ফাইল | কীসের জন্য |
            |---|---|
            | **Worker-Gig-BD.apk** | ফোনে সরাসরি ইনস্টল / যেকোনো অ্যাপ স্টোর (APKPure, APKCombo ইত্যাদি) |
            | **Worker-Gig-BD.aab** | শুধু Google Play Console-এ আপলোড |

            **স্থায়ী ডাইরেক্ট APK লিংক** (শেয়ার করুন — Telegram/WhatsApp/ওয়েবসাইটে):
            ```
            https://github.com/wasimmostakim2965-ui/Worker-gig-BD-app/releases/latest/download/Worker-Gig-BD.apk
            ```

            APK ফাইলটা সরাসরি ডাউনলোড হয় — কোনো ZIP/extract করতে হয় না।

            > প্রোডাকশন keystore দিয়ে সাইনড (GitHub Secrets থেকে)।
          files: release-out/*
          make_latest: true
