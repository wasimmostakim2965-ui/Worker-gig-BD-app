name: Build Android App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Pinned: newer stable Flutter requires Gradle >= 8.14, while this
          # project's generated Gradle wrapper is 8.12 (valid for 3.35.x).
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      # Signed release builds: Gradle loads android/key.properties and signs
      # with android/app/workergigbd.jks (production keystore). The APK is a
      # universal standalone build (all ABIs, no splits) — uploadable to any
      # store. The AAB is for Google Play.
      - run: flutter build apk --release

      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
